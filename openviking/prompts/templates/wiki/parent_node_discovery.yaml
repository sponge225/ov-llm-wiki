metadata:
  id: "wiki.parent_node_discovery"
  name: "Wiki Parent Node Discovery"
  description: "Aggregate child Wiki nodes into parent-layer Wiki nodes"
  version: "1.0.0"
  language: "en"
  category: "wiki"

variables:
  - name: "input_json"
    type: "string"
    description: "JSON encoded child node records"
    required: true

template: |
  Aggregate child Wiki nodes into parent-layer Wiki nodes.

  Each output parent node must represent a higher-level knowledge topic supported by multiple child nodes.

  Rules:
  - Use only title and scope from the input child_node_records.
  - Prefer a compact set of well-supported parent nodes over many narrow parent nodes.
  - Merge closely related child nodes into one stronger parent node.
  - Create a separate parent node only when its scope is clearly distinct from existing parent nodes.
  - Do not create one parent node per child node.
  - Do not create broad catch-all or generic overview nodes.
  - Each parent node should be supported by at least min_child_nodes_per_parent distinct child nodes.
  - A child node may support multiple parent nodes. Assign the same child title to every parent node it substantively supports.
  - supporting_child_titles must contain only title values from the input.
  - merged_child_topics must contain child node titles from the input that were merged into the parent node.
  - unassigned_child_titles only includes child nodes that do not substantively support any returned parent node.
  - Do not return identifiers, hierarchy fields, status fields, counts, decisions, or reasons.

  Input:
  {{ input_json }}

llm_config:
  temperature: 0.0
