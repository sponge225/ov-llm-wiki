metadata:
  id: "wiki.node_documents"
  name: "Wiki Node Documents"
  description: "Generate synthesized documents for a Wiki node from source sections"
  version: "1.0.0"
  language: "en"
  category: "wiki"

variables:
  - name: "input_json"
    type: "string"
    description: "JSON encoded node and source sections"
    required: true
  - name: "max_document_tokens"
    type: "int"
    description: "Maximum estimated output tokens"
    required: true
    default: 16000

template: |
  Generate one Wiki document for the given Wiki node.

  Task:
  - Write one complete synthesized Markdown document for this Wiki node.
  - Use only the section text provided in the input source documents.
  - Use the node title and scope as the topic boundary: include content inside this boundary, and exclude related but out-of-scope content.
  - A source document may be an original resource document or a generated lower-layer Wiki node document.
  - Synthesize across source documents instead of summarizing each source separately.
  - Organize the content by synthesized knowledge, not by source document.
  - Do not write one paragraph for source 1, another paragraph for source 2, and so on.
  - Each substantive paragraph should present a higher-level conclusion, pattern, mechanism, tradeoff, or comparison derived from multiple source documents whenever multiple relevant source documents are available.
  - Use source-specific details only as supporting material inside a synthesized paragraph, not as the paragraph's organizing principle.
  - Avoid headings or paragraph openings that name or enumerate individual input sources.
  - Do not invent document IDs, section URIs, citations, URLs, or other identifiers.
  - If a factual statement cannot be supported by the provided source sections, do not include it.

  Input:
  {{ input_json }}

  Output requirements:
  - markdown: the complete Markdown document.
  - The first line must be exactly the H1 heading "# <node.title>".
  - Include at least one H2 heading.
  - Keep the complete Markdown within {{ max_document_tokens }} tokens.
  - The document must read like a new Wiki-level synthesis, not a sequence of per-source summaries.

  Return only JSON matching the schema.

llm_config:
  temperature: 0.0
