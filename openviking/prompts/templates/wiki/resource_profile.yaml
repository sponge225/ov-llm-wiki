metadata:
  id: "wiki.resource_profile"
  name: "Wiki Resource Profile"
  description: "Generate a resource-space profile from Document Cards"
  version: "1.0.0"
  language: "en"
  category: "wiki"

variables:
  - name: "boundary"
    type: "string"
    description: "Wiki data boundary instruction"
    required: true
  - name: "input_json"
    type: "string"
    description: "JSON encoded Document Card summary list"
    required: true

template: |
  Generate a short resource space profile from the provided Document Cards.

  {{ boundary }}

  Do not generate wiki nodes. Do not include the full resource list.

  Input:
  {{ input_json }}

llm_config:
  temperature: 0.0
